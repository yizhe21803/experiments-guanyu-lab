name: Bootstrap frozen GUANYU LAB repository

on:
  push:
    paths:
      - 'bootstrap/READY'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore frozen repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-* > /tmp/guanyu-lab-frozen.b64
          base64 -d /tmp/guanyu-lab-frozen.b64 > /tmp/guanyu-lab-frozen.zip
          echo "29c5604a2247c505f986e461388058a54ea5882726347a52f933e7d188152b05  /tmp/guanyu-lab-frozen.zip" | sha256sum -c -
          mkdir -p /tmp/guanyu-lab-frozen
          unzip -q /tmp/guanyu-lab-frozen.zip -d /tmp/guanyu-lab-frozen
          src=/tmp/guanyu-lab-frozen/experiments-guanyu-lab-frozen
          shopt -s dotglob
          for p in "$src"/*; do
            name=$(basename "$p")
            [[ "$name" == ".git" ]] && continue
            [[ "$name" == ".github" ]] && continue
            rm -rf "./$name"
            cp -a "$p" "./$name"
          done
          rm -rf bootstrap
          git config user.name "观屿实验室"
          git config user.email "yizhe21803@gmail.com"
          git add -A
          git commit -m "chore: import frozen MS-01 and MS-02 releases"
          git push origin HEAD:main
