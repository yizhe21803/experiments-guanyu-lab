name: Validate GUANYU LAB repository
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-registry.mjs
      - run: node scripts/validate-repository-contract.mjs
      - run: node scripts/validate-freeze.mjs
